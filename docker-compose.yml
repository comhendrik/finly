services:
  server:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-finly}:${POSTGRES_PASSWORD:-finly-local-change-me}@db:5432/${POSTGRES_DB:-finly}?sslmode=disable
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finly}
      POSTGRES_USER: ${POSTGRES_USER:-finly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finly-local-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
