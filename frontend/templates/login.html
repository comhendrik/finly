<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>Finly – Anmeldung</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="login-shell"><form class="login-card" action="/login" method="post"><a class="brand" href="/login"><span>finly<span class="brand-dot">.</span></span></a><h1>Anmelden</h1><p>Melde dich mit deinem Finly-Konto an.</p>{{if .Error}}<div class="login-error" role="alert">{{.Error}}</div>{{end}}<label for="username">Benutzername</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Passwort</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="settings-save" type="submit">Anmelden</button><p>Neu bei Finly? <a href="/signup">Konto erstellen</a></p></form></main></body></html>
