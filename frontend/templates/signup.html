<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>Finly – Konto erstellen</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="login-shell"><form class="login-card" action="/signup" method="post"><a class="brand" href="/signup"><span>finly<span class="brand-dot">.</span></span></a><h1>Konto erstellen</h1><p>Erstelle dein persönliches Finly-Konto. Deine Finanzdaten bleiben von anderen Konten getrennt.</p>{{if .Notice}}<div class="toast">{{.Notice}}</div>{{end}}{{if .Error}}<div class="login-error" role="alert">{{.Error}}</div>{{end}}<label for="username">Benutzername</label><input id="username" name="username" minlength="3" maxlength="64" autocomplete="username" required autofocus><label for="password">Passwort</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required><label for="password-confirm">Passwort wiederholen</label><input id="password-confirm" name="password_confirm" type="password" minlength="12" autocomplete="new-password" required><button class="settings-save" type="submit">Konto erstellen</button><p>Schon registriert? <a href="/login">Anmelden</a></p></form></main></body></html>
