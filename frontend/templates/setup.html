<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>Finly – Konto einrichten</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="login-shell"><form class="login-card" action="/setup" method="post"><a class="brand" href="/setup"><span>finly<span class="brand-dot">.</span></span></a><h1>Konto erstellen</h1><p>Lege dein Finly-Konto an. Dein Passwort wird als gesalzener Hash in der Datendatei gespeichert.</p>{{if .Error}}<div class="login-error" role="alert">{{.Error}}</div>{{end}}<label for="username">Benutzername</label><input id="username" name="username" minlength="3" maxlength="64" autocomplete="username" required autofocus><label for="password">Passwort</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required><label for="password-confirm">Passwort wiederholen</label><input id="password-confirm" name="password_confirm" type="password" minlength="12" autocomplete="new-password" required><button class="settings-save" type="submit">Konto erstellen</button></form></main></body></html>
