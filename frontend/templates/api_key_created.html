<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Finly – API-Key erstellt</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="login-shell"><section class="login-card"><a class="brand" href="/"><span>finly<span class="brand-dot">.</span></span></a><h1>API-Key erstellt</h1><p>Dieser Bearer-Token wird nur jetzt angezeigt. Kopiere ihn sicher; Finly speichert nur seinen Hash. Gültig bis {{.ExpiresAt}}.</p><label for="token">JWT Bearer-Token</label><textarea id="token" readonly rows="6">{{.Token}}</textarea><button class="settings-save" type="button" onclick="navigator.clipboard.writeText(document.getElementById('token').value)">Token kopieren</button><a class="settings-link" href="/?tab=settings">Zurück zu den Einstellungen</a></section></main></body></html>
